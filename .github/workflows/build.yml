name: Build

on: [workflow_call]

jobs:
  build-collection:
    name: Build Collection
    runs-on: ubuntu-latest
    steps:
      # The collection version comes from `voraus/ipc_tools/galaxy.yml`, so no history or
      # tags are needed here.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Build
        run: uv run --locked --extra tox tox -e build

      - name: Require non dirty git workspace
        run: |
          CHANGES=$(git status --porcelain)
          if [[ -n "$CHANGES" ]]; then
            echo "❌ Workspace is dirty. The following files have been modified:"
            echo "$CHANGES"
            exit 1
          else
            echo "✅ Workspace is clean."
          fi

      - name: Upload collection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collection
          path: '*.tar.gz'
