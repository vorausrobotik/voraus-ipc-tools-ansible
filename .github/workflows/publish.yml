name: Publish

on: [workflow_call]

# The GitHub release and its changelog are created by release-please when the release pull
# request is merged, see `release.yml`. This workflow only publishes the artifacts.
jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs
          path: docs

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  publish-collection:
    runs-on: ubuntu-latest
    steps:
      # Needed so `ansible-galaxy` comes from uv.lock rather than an unpinned install.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: collection

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # `--no-install-project` skips the editable build; only `ansible` is needed here.
      - name: Install ansible
        run: uv sync --locked --no-install-project

      - name: Deploy collection to Ansible
        id: deployment
        run: uv run --no-sync ansible-galaxy collection publish *.tar.gz --token ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
