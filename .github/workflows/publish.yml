name: Publish

on: [workflow_call]

jobs:
  create-github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run JReleaser
        uses: jreleaser/release-action@v2
        with:
          version: latest
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_PROJECT_VERSION: ${{ github.ref_name }}

  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-collection:
    runs-on: ubuntu-latest
    steps:
      # Needed so `ansible-galaxy` comes from uv.lock rather than an unpinned install.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: collection

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # `--no-install-project` skips the editable build; only `ansible` is needed here,
      # which keeps this job independent of setuptools_scm and the git history.
      - name: Install ansible
        run: uv sync --locked --no-install-project

      - name: Deploy collection to Ansible
        id: deployment
        run: uv run --no-sync ansible-galaxy collection publish *.tar.gz --token ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
