name: Tests

on: [workflow_call]

jobs:
  discover-roles:
    name: Discover Roles with Molecule Tests
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.discover.outputs.roles }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find roles with Molecule tests
        id: discover
        run: |
          roles=$(ls molecule | grep -vE "shared|__" | jq -R -s -c 'split("\n")[:-1]')
          echo "roles=$roles" >> $GITHUB_OUTPUT
        shell: bash

  run-tests:
    name: Run Molecule Tests
    needs: discover-roles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.discover-roles.outputs.roles) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Creates `.venv` from uv.lock. Molecule needs root for vagrant/libvirt, so the
      # later steps run under sudo against this venv rather than installing as root.
      - name: Install python dependencies
        run: uv sync --locked --all-extras

      - name: Build collection
        run: sudo bash -c "source .venv/bin/activate && ansible-galaxy collection build --force voraus/ipc_tools"

      - name: Install ansible dependencies
        run: |
          sudo .venv/bin/ansible-galaxy collection install -r requirements.yml
          sudo .venv/bin/ansible-galaxy role install -r requirements.yml

      - name: Install dependencies
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt update && sudo apt install -y vagrant
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-clients \
            vagrant \
            qemu-system \
            qemu-kvm \
            libvirt-daemon-system
          sudo vagrant plugin install vagrant-libvirt

      - name: Run Molecule tests for ${{ matrix.role }}
        run: |
          sudo bash -c "
            source .venv/bin/activate && \
            source scripts/setup-ansible-env.sh && \
            molecule test -s ${{ matrix.role }}
          "
