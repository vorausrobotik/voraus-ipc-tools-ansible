name: Lint

on: [workflow_call]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # Python version comes from `.python-version`, tox from `uv.lock`.
      - name: Build and run static checks
        run: uv run --locked --extra tox tox -e build,lint
