name: Lint

on: [workflow_call]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Python version comes from `.python-version`, tox from `uv.lock`.
      - name: Build and run static checks
        run: uv run --locked --extra tox tox -e build,lint
