name: Release Please

on:
  push:
    branches:
      - main

# Fallback scopes for runs without the App credentials below.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain the release pull request and tag releases
    runs-on: ubuntu-latest
    steps:
      # The plain `GITHUB_TOKEN` would still create the tag and the GitHub release, but
      # GitHub's actions-cannot-trigger-actions rule means the resulting tag push does not
      # start a workflow run. `pipeline.yml` publishes on tags, so releases would never be
      # published. Acting as the org App makes the tag push a regular event again and also
      # gives the release pull request its usual CI run.
      - name: Mint app token
        id: app-token
        if: vars.GH_AUTOMATIONS_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The numeric App ID is a valid issuer too; client-id is the non-deprecated input name.
          client-id: ${{ vars.GH_AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.GH_AUTOMATIONS_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Maintains a release pull request that bumps the collection version
      # (`voraus/ipc_tools/galaxy.yml`, `pyproject.toml` and `uv.lock`) and `CHANGELOG.md`
      # from the Conventional Commits merged into main. Merging it creates the git tag,
      # which triggers `pipeline.yml` and therefore the publishing jobs.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Without the App the release is tagged but never published, which is easy to miss.
      - name: Assert the release can be published
        if: steps.release.outputs.release_created == 'true' && steps.app-token.outputs.token == ''
        run: |
          echo "::error::Release ${{ steps.release.outputs.tag_name }} was tagged with the default\
          GITHUB_TOKEN, so the tag did not trigger 'pipeline.yml'. Configure the\
          GH_AUTOMATIONS_APP_ID variable and the GH_AUTOMATIONS_PRIVATE_KEY secret, then re-run the\
          pipeline for the tag manually to publish it."
          exit 1
