- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Set fact for non-rt linux-image and linux-headers packages
  ansible.builtin.set_fact:
    realtime_kernel_non_rt_kernels: >-
      {{
        ansible_facts.packages | dict2items
        | selectattr('key', 'match', '^(linux-image-|linux-headers-)')
        | rejectattr('key', 'match', '.*rt.*')
        | map(attribute='key') | list
      }}

- name: Update kernel parameters if necessary
  ansible.builtin.include_role:
    name: voraus.ipc_tools.grub_config
  vars:
    grub_config_entries_to_set:
      nomodeset:
  register: realtime_kernel_kernel_params_update

- name: Run install/uninstall tasks
  when: >-
    realtime_kernel_apt_packages | reject('in', ansible_facts.packages.keys()) | list | length > 0
    or
    realtime_kernel_non_rt_kernels | length > 0
    or
    '-rt-' not in ansible_kernel
    or
    realtime_kernel_kernel_params_update.changed
  notify:
    - Reboot Machine
  block:
    - name: Make /boot writable
      ansible.builtin.include_role:
        name: voraus.ipc_tools.boot_mount
        tasks_from: read_write

    - name: Install realtime kernel and header packages
      ansible.builtin.apt:
        update_cache: true
        pkg: '{{ realtime_kernel_apt_packages }}'
      register: realtime_kernel_apt_install

    - name: Refresh package facts after installation # noqa: no-handler
      ansible.builtin.package_facts:
        manager: auto
      when: realtime_kernel_apt_install.changed

    - name: Update non-rt kernel package list after installation # noqa: no-handler
      ansible.builtin.set_fact:
        realtime_kernel_non_rt_kernels: >-
          {{
            ansible_facts.packages | dict2items
            | selectattr('key', 'match', '^(linux-image-|linux-headers-)')
            | rejectattr('key', 'match', '.*rt.*')
            | map(attribute='key') | list
          }}
      when: realtime_kernel_apt_install.changed

    - name: Remove non-rt kernel and header packages
      ansible.builtin.apt:
        name: '{{ realtime_kernel_non_rt_kernels }}'
        state: absent
        autoremove: true
        purge: true
      when: realtime_kernel_non_rt_kernels | length > 0

    - name: Update GRUB # noqa no-changed-when
      when: >-
        '-rt-' not in ansible_kernel
        or
        realtime_kernel_apt_install.changed
        or
        realtime_kernel_kernel_params_update.changed
      ansible.builtin.command: update-grub2

    - name: Make /boot read-only again
      ansible.builtin.include_role:
        name: voraus.ipc_tools.boot_mount
        tasks_from: read_only
