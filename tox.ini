[tox]
envlist =
    lint
isolated_build = True

[testenv]
# Install every environment from uv.lock instead of resolving dependencies per env,
# so tox, CI and local development all get identical package versions.
runner = uv-venv-lock-runner
# tox-uv passes `--locked` by default (uv_sync_locked), so a stale uv.lock fails the
# run instead of being silently re-locked.
basepython = py313
# Passes host environment variables to the tox environment.
passenv =
    CODEMETER_HOST
    SOURCE_DATE_EPOCH
# Define additional environment variables for all test environments.
setenv = []

[testenv:lint]
description = Run static checkers.
setenv =
    {[testenv]setenv}
    DOCSDIR = {toxinidir}/docs
    CI=true
allowlist_externals =
    npx
    bash
extras = lint
depends =
    build
commands =
    # Install ansible collection
    ansible-galaxy collection install -f voraus/ipc_tools
    # Install roles from requirements.yml
    ansible-galaxy role install -r requirements.yml
    # Ansible lint
    ansible-lint
    # Prettier
    npx --yes prettier --check .
    # Check import ordering
    isort . --check
    # Check formatting
    black . --check
    # Check type hinting
    mypy .
    # Lint source code
    ruff check .
    # Dynamically exclude symlinked .py files to avoid false duplicate-code reports
    bash -c 'pylint . --ignore-paths="$(find . -type l -name "*.py" | paste -sd "|" -)" {posargs}'
    # Check .rst files
    doc8 {env:DOCSDIR}


[testenv:test]
# Local-only environment. CI runs molecule directly per role in `test.yml`, because
# each scenario needs a vagrant/libvirt VM and root privileges on the runner.
description = Run the molecule test suite. Requires vagrant and libvirt on the host.
extras = test
depends =
    build
setenv =
    PY_IGNORE_IMPORTMISMATCH=1
allowlist_externals =
    bash
commands =
    # tox does not execute commands through a shell, so `source` needs an explicit
    # bash. Pass e.g. `-- test -s grub_config` to run a single scenario.
    bash -c 'source scripts/setup-ansible-env.sh && molecule {posargs:test --all}'

[testenv:docs]
description = Test and build the docs.
setenv =
    DOCSDIR = {toxinidir}/docs
    BUILDDIR = {toxinidir}/docs/build
extras = doc
commands =
    # Remove build directory
    python -c 'import shutil; shutil.rmtree("{env:BUILDDIR}", ignore_errors=True);'
    # Create dummy files to prevent warnings
    python -c 'import pathlib; pathlib.Path("{env:DOCSDIR}").joinpath("license_compliance.rst").write_text("");'
    # Run doctests (only from .rst files in docs folder, doctests in .py files are covered by pytest)
    sphinx-build -b doctest -W -d "{env:BUILDDIR}/doctrees" "{env:DOCSDIR}" "{env:BUILDDIR}/doctest" {posargs}
    # Dump OSS license information into the docs directory
    python {env:DOCSDIR}/_scripts/generate_license_information.py
    # Build the docs
    sphinx-build -b html -d "{env:BUILDDIR}/doctrees" "{env:DOCSDIR}" "{env:BUILDDIR}/html" {posargs}


[testenv:build]
description = Build the package.
extras = build
allowlist_externals =
    make
commands =
    make
